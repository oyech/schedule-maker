<div class="modal-header">
  <div>
    <div class="modal-badge">KONFIGURASI TIM</div>
    <h3 class="modal-title">Kelola Personil & Shift</h3>
    <p class="modal-subtitle">Tambah, edit nama/jabatan, atur regu shift, atau hapus anggota tim.</p>
  </div>
  <button type="button" class="btn-icon-close" onclick="document.getElementById('staff-dialog').close()" title="Tutup">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
</div>

<!-- Add New Person Form Card -->
<div class="add-staff-card">
  <div class="add-staff-header">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
    <span>Tambah Personil Baru</span>
  </div>
  <div class="add-staff-grid">
    <div class="form-field">
      <label for="new-staff-group">Kelompok Kerja</label>
      <select id="new-staff-group" class="form-input">
        <option value="reguler">Staff & Supervisor (Reguler)</option>
        <option value="shift">Engineering Shift (24 Jam)</option>
        <option value="daily_worker">Daily Worker (DW)</option>
      </select>
    </div>
    <div class="form-field">
      <label for="new-staff-title">Jabatan / Posisi</label>
      <input type="text" id="new-staff-title" class="form-input" placeholder="e.g. Supervisor, PIC Tower A">
    </div>
    <div class="form-field">
      <label for="new-staff-name">Nama Lengkap</label>
      <input type="text" id="new-staff-name" class="form-input" placeholder="Nama Karyawan">
    </div>
    <div class="form-field" id="new-staff-offset-wrapper">
      <label for="new-staff-offset">Regu Rotasi</label>
      <select id="new-staff-offset" class="form-input">
        <option value="2">Regu 1 (1 Nov: S)</option>
        <option value="4">Regu 2 (1 Nov: M)</option>
        <option value="6">Regu 3 (1 Nov: OFF)</option>
        <option value="0">Regu 4 (1 Nov: P)</option>
      </select>
    </div>
    <div class="form-field form-field-btn">
      <button type="button" class="btn btn-primary" id="btn-add-staff-submit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Tambah
      </button>
    </div>
  </div>
</div>

<!-- Staff List Tabs / Groups -->
<div id="staff-list-container">
  <!-- Rendered dynamically via JS -->
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-ghost-danger btn-sm" id="btn-reset-default-staff">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    Reset ke Standar Awal
  </button>
  <div style="display: flex; gap: 10px;">
    <button type="button" class="btn btn-outline" onclick="document.getElementById('staff-dialog').close()">Batal</button>
    <button type="button" class="btn btn-primary" id="btn-save-staff-changes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      Terapkan ke Jadwal
    </button>
  </div>
</div>
